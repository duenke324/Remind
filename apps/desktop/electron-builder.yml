appId: io.github.duenke324.remind
productName: Remind
executableName: Remind
copyright: Copyright © 2026 Remind
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
protocols:
  - name: Remind
    schemes:
      - remind
win:
  target:
    - target: nsis
      arch: [x64]
  # Nome fixo: o site aponta sempre para releases/latest/download/<nome>.
  artifactName: Remind-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Remind
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  # Sem certificado Apple por agora: assinatura "ad-hoc" (gratuita, sem notarização).
  # Sem nenhuma assinatura, os Macs com chip Apple dizem que a app "está danificada";
  # com ad-hoc mostram o aviso normal e basta "Abrir mesmo assim" em Privacidade e segurança.
  identity: '-'
  # O runtime reforçado exige que todas as bibliotecas tenham a mesma equipa de assinatura,
  # o que uma assinatura ad-hoc não tem: a app não arrancava.
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Remind-${arch}.${ext}
dmg:
  title: Remind ${version}
linux:
  target: dir
  executableName: remind
