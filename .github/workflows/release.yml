name: Instaladores

# Gera o .exe (Windows) e o .dmg (macOS).
#
# Lançar uma versão (o caminho recomendado):
#   Actions → Instaladores → Run workflow → ramo "main" → ligar "Lançar versão" → Run workflow.
#   Usa sempre o main atual, escolhe a versão seguinte (ou a que escreveres), verifica os instaladores
#   e só depois cria a Release com os ficheiros. Os botões do site apontam para a última Release.
#
# Outros casos:
# - Run workflow sem "Lançar versão": só gera os instaladores (ficam em "Artifacts" da execução).
# - Publicar uma Release à mão (Releases → Draft a new release): gera os instaladores e anexa-os.
# - PRs que mudem a configuração dos instaladores: gera-os para testar.
on:
  workflow_dispatch:
    inputs:
      lancar:
        description: Lançar versão (criar a Release com os instaladores)
        type: boolean
        default: false
      versao:
        description: Versão (ex. 0.2.0). Vazio = a seguinte à última Release.
        type: string
        required: false
        default: ''
  release:
    types: [published]
  # Em PRs, só quando a configuração dos instaladores muda (as máquinas macOS gastam 10x mais minutos).
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/package.json
      - apps/desktop/.env.production

permissions:
  contents: read

# Em PRs, um novo envio cancela a geração anterior do mesmo ramo; lançamentos nunca são cancelados.
concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide que commit e que número de versão usar.
  preparar:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      sha: ${{ steps.versao.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Escolher a versão
        id: versao
        env:
          EVENTO: ${{ github.event_name }}
          LANCAR: ${{ github.event_name == 'workflow_dispatch' && inputs.lancar }}
          PEDIDA: ${{ inputs.versao }}
          TAG_RELEASE: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PACOTE=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$EVENTO" = release ]; then
            VERSAO="${TAG_RELEASE#v}"
          elif [ "$LANCAR" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Só se lançam versões a partir do ramo main (escolhe \"main\" em Run workflow)."
              exit 1
            fi
            if [ -n "$PEDIDA" ]; then
              VERSAO="${PEDIDA#v}"
            else
              ULTIMA=$(git tag -l 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
              ULTIMA="${ULTIMA:-0.0.0}"
              MAIOR=$(printf '%s\n%s\n' "$ULTIMA" "$PACOTE" | sort -V | tail -1)
              if [ "$MAIOR" = "$PACOTE" ] && [ "$PACOTE" != "$ULTIMA" ]; then
                VERSAO="$PACOTE"
              else
                IFS=. read -r MA MI PA <<<"$ULTIMA"
                VERSAO="$MA.$MI.$((PA + 1))"
              fi
            fi
            if git rev-parse -q --verify "refs/tags/v$VERSAO" >/dev/null; then
              echo "::error::A versão v$VERSAO já existe. Escreve outra no campo \"Versão\"."
              exit 1
            fi
          else
            VERSAO="$PACOTE"
          fi
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: \"$VERSAO\" (usa o formato 1.2.3)."
            exit 1
          fi
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Versão $VERSAO a partir de $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: preparar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: apps/desktop/release/*.exe
          - os: macos-latest
            script: dist:mac
            files: apps/desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preparar.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pôr o número da versão na app
        shell: bash
        env:
          VERSAO: ${{ needs.preparar.outputs.versao }}
        run: npm pkg set "version=$VERSAO" -w @remind/desktop
      - name: Gerar instalador
        run: npm run ${{ matrix.script }} -w @remind/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # A assinatura do Mac é ad-hoc (sem certificado nem segredos), por isso pode correr também em PRs.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verificar que o instalador conhece o servidor
        shell: bash
        run: |
          # Sem isto, a app instalada diz "Esta versão do Remind ainda não tem servidor de contas configurado".
          if ! grep -rq "remind-server.vercel.app" apps/desktop/out/main; then
            echo "::error::O endereço do servidor (apps/desktop/.env.production) não entrou no build."
            exit 1
          fi
      - name: Verificar assinatura do Mac
        if: runner.os == 'macOS'
        run: |
          for app in apps/desktop/release/mac*/Remind.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Signature|Format)'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instalador-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Release publicada à mão: anexa os instaladores.
  attach:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: instaladores
          merge-multiple: true
      - name: Anexar instaladores à Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" instaladores/* --repo "$GITHUB_REPOSITORY" --clobber

  # Botão "Lançar versão": cria a Release só depois de os dois instaladores passarem as verificações.
  lancar:
    if: github.event_name == 'workflow_dispatch' && inputs.lancar
    needs: [preparar, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: instaladores
          merge-multiple: true
      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.preparar.outputs.versao }}
          SHA: ${{ needs.preparar.outputs.sha }}
        run: |
          gh release create "v$VERSAO" instaladores/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Remind v$VERSAO" \
            --notes "Instaladores do Remind v$VERSAO para Windows e macOS." \
            --latest
          echo "Release v$VERSAO criada: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSAO" >> "$GITHUB_STEP_SUMMARY"
