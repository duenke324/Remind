name: Instaladores

# Gera o .exe (Windows) e o .dmg (macOS).
# - Manualmente (Actions → Instaladores → Run workflow): ficheiros ficam como artefactos da execução.
# - Em PRs que mudem a configuração dos instaladores ou a versão da app: artefactos da execução.
# - Ao publicar uma Release no GitHub (Releases → Draft a new release → tag vX.Y.Z → Publish):
#   gera os instaladores e anexa-os a essa Release.
on:
  workflow_dispatch:
  release:
    types: [published]
  # Em PRs, só quando a configuração dos instaladores muda (as máquinas macOS gastam 10x mais minutos).
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/package.json

permissions:
  contents: read

# Um novo envio cancela a geração anterior do mesmo ramo (as máquinas macOS gastam 10x mais minutos).
concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: apps/desktop/release/*.exe
          - os: macos-latest
            script: dist:mac
            files: apps/desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Gerar instalador
        run: npm run ${{ matrix.script }} -w @remind/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instalador-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  attach:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: instaladores
          merge-multiple: true
      - name: Anexar instaladores à Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" instaladores/* --repo "$GITHUB_REPOSITORY" --clobber
