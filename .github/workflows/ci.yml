name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: remind_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/remind_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Garantir o Electron instalado (antes de qualquer teste o arrancar)
        run: node node_modules/electron/install.js && test -x node_modules/electron/dist/electron
      - name: Browser para os testes do site
        run: npx playwright install --with-deps chromium
      - name: Verificar tipos
        run: npm run lint
      - name: Testes (unitários e integração do servidor)
        run: npm test
      - name: Testes E2E (app Electron e site)
        run: xvfb-run -a npm run test:e2e
